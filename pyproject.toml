[project]
name = "blender-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "mcp>=1.2",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
]
[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
